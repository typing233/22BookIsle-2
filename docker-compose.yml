version: '3.8'

services:
  bookisle:
    build: .
    container_name: bookisle
    ports:
      - "3000:3000"
    volumes:
      - bookisle-data:/app/data
      - /mnt/nas/books:/books:ro
      - /home/user/ebooks:/ebooks:ro
    environment:
      - JWT_SECRET=change-this-to-a-long-random-string
      - REFRESH_SECRET=change-this-to-another-secret
      - DATA_DIR=/app/data
      - NODE_ENV=production
      - PORT=3000
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3000/api/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    restart: unless-stopped
    deploy:
      resources:
        limits:
          memory: 512M

volumes:
  bookisle-data:
